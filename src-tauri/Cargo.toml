[package]
name = "xiaojing"
version = "0.5.1"
description = "鲸杉geo GEO 营销工作台"
edition = "2021"
# MSRV follows the repository-owned toolchain so clippy and release builds use
# one standard-library surface. Windows paths that must replace an
# existing file use an explicit MoveFileExW(REPLACE_EXISTING) helper because
# `std::fs::rename` does not provide portable replace semantics.
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "xiaojing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
url = "2"
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["devtools", "image-png", "unstable", "webview-data-url", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
which = "8.0.0"
libc = "0.2.180"
tauri-plugin-localhost = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.13.1", features = ["stream", "json", "blocking", "multipart", "socks", "form"] }
futures-util = "0.3.31"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
futures = "0.3"
base64 = "0.22"
dirs = "6.0"
sys-locale = "0.3.2"
uuid = { version = "1.11", features = ["v4"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
prost = "0.13"
pulldown-cmark = "0.12"
# YAML frontmatter parsing for slash command / skill SKILL.md files (workspace_files::slash)
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
# Fuzzy file name search for @ mention picker — small dependency, used only inside workspace_files::search
fuzzy-matcher = "0.3"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "query", "http1"] }
cron = "0.15"
notify-debouncer-full = "0.6"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
same-file = "1.0"
trash = "5.2.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
url = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate-zlib"] }

# Pattern 5: stale-lock recovery needs `kill(pid, 0)` for liveness probing on Unix.
# The `signal` feature pulls in just `nix::sys::signal::kill` + `nix::unistd::Pid`,
# nothing else.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal"] }

# macOS-only: runtime workaround for AppKit function-key private-use text
# leaking from WKWebView arrow-key handling into focused text controls.
# Keep keyDown flowing through WebKit for caret movement, then clean U+F700-
# U+F74F from the DOM value when the leak happens.
# See tauri-apps/tauri#5685, tauri-apps/wry#769, tauri-apps/tauri#10194.
[target.'cfg(target_os = "macos")'.dependencies]
# Account login tokens live in the macOS Keychain (票 06 account owner).
# Version 3.7 is already locked transitively via reqwest native-tls.
security-framework = "3.7"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
objc2-web-kit = { version = "0.3.2", features = ["WKWebView", "block2"] }
# Main-window traffic-light layout owner. Keep the feature surface limited to
# the NSWindow chrome/view types used by `macos_traffic_light.rs`.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSResponder", "NSButton", "NSControl", "std"] }

# Windows platform APIs:
# - pid-liveness/start-time probes via PROCESS_QUERY_LIMITED_INFORMATION
# - ShellExecuteW URL handoff for default browser opens without cmd.exe metacharacter parsing
# - wake-lock power requests below
# - handle-relative workspace IO via NtCreateFile(ObjectAttributes.RootDirectory)
# Minimal feature set — version 0.59 is already pulled transitively, so no new lock entry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    # `tests/windows_linkage.rs`（Common-Controls v6 绑定回归）用
    # GetModuleHandleA/GetProcAddress 做运行时符号断言。
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # `wake_lock::windows::PlatformImpl` calls `PowerCreateRequest` +
    # `PowerSetRequest` (PowerRequestSystemRequired | PowerRequestAwayModeRequired)
    # to keep the OS from idle-sleeping during long-running GEO monitoring.
    # HANDLE-based on purpose — `SetThreadExecutionState` is per-thread and
    # silently leaks the assertion across Tokio worker resumption; see
    # `src/wake_lock/windows.rs` for the trade-off.
    "Win32_System_Power",
] }
# `junction` creates NTFS directory junctions without admin / Developer Mode
# (`std::os::windows::fs::symlink_dir` would otherwise need ERROR_PRIVILEGE_NOT_HELD
# elevated rights). The path-safety Windows tests use this to verify that
# no-follow workspace IO rejects junction races.
junction = "1.0"
# WinRT toast notifications with click activation. `tauri-plugin-notification`
# wraps this same crate but doesn't expose the `on_activated` callback we need
# to bring the app to the foreground when the user clicks a toast. Promoting
# it to a direct dependency lets `notification::show_with_navigation` register
# the callback ourselves while still sharing the version locked in the dep
# graph (notify-rust pulls 0.7.x transitively).
tauri-winrt-notification = "0.7"

[dev-dependencies]
tauri = { version = "2.11.2", features = ["test"] }
tempfile = "3.10"
