name: Test (Windows, manual)

# The Windows rust leg bills Actions minutes at 2x and cannot execute tests
# headlessly (WebView2 loader entry points), so it is compile-only and manual:
# run it before producing a Windows internal-unsigned candidate or after
# Windows-touching rust changes. Automatic gates live in test.yml (Linux).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - name: Prepare checked build resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/claude-agent-sdk src-tauri/resources/sharp-runtime src-tauri/resources/nodejs src-tauri/resources/portable-git
          touch src-tauri/resources/claude-agent-sdk/.gitkeep
          touch src-tauri/resources/sharp-runtime/.gitkeep
          touch src-tauri/resources/nodejs/.gitkeep
          touch src-tauri/resources/portable-git/.gitkeep
          npm run build:server
      # The Windows test binary links WebView2 loader entry points a headless
      # runner cannot resolve (STATUS_ENTRYPOINT_NOT_FOUND), so only compile
      # the test targets; execution is covered by the Linux leg in test.yml.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-run
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
