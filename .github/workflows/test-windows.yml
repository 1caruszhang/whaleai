name: Test (Windows, manual)

# The Windows rust leg bills Actions minutes at 2x and stays manual: run it
# before producing a Windows internal-unsigned candidate or after
# Windows-touching rust changes. Automatic gates live in test.yml (Linux).
# 2026-08-26 root cause: test binaries previously died pre-main with
# STATUS_ENTRYPOINT_NOT_FOUND — NOT WebView2, but comctl32 binding to the 5.82
# assembly because test exes carried no Common-Controls v6 manifest (fixed in
# src-tauri/build.rs via /MANIFESTDEPENDENCY; regression test in
# src-tauri/tests/windows_linkage.rs). Test execution on Windows is therefore
# possible again when needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - name: Prepare checked build resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/claude-agent-sdk src-tauri/resources/sharp-runtime src-tauri/resources/nodejs src-tauri/resources/portable-git
          touch src-tauri/resources/claude-agent-sdk/.gitkeep
          touch src-tauri/resources/sharp-runtime/.gitkeep
          touch src-tauri/resources/nodejs/.gitkeep
          touch src-tauri/resources/portable-git/.gitkeep
          npm run build:server
      # Keep compile-only for the manual gate (billing); execution now works
      # on Windows since the Common-Controls v6 manifest fix in
      # src-tauri/build.rs — see the header comment. Execution gates stay in
      # the Linux leg of test.yml.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-run
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
