name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:windows-x64
      - run: npm run test:windows-x64
      - run: npm run test:classification
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:server
      # The production Vite build peaks past Node's ~2GB default heap during
      # chunk rendering; keep the heap raised or this gate OOMs (see ab05f80,
      # dropped once by the dfed6ad workflow rewrite).
      - run: npm run build:web
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  rust:
    strategy:
      # Keep the sibling OS running so cargo test/clippy results stay visible
      # when one side fails an early gate (e.g. fmt).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare checked build resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/claude-agent-sdk src-tauri/resources/sharp-runtime src-tauri/resources/nodejs src-tauri/resources/portable-git
          touch src-tauri/resources/claude-agent-sdk/.gitkeep
          touch src-tauri/resources/sharp-runtime/.gitkeep
          touch src-tauri/resources/nodejs/.gitkeep
          touch src-tauri/resources/portable-git/.gitkeep
          npm run build:server
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # The Windows test binary links WebView2 loader entry points a headless
      # runner cannot resolve (STATUS_ENTRYPOINT_NOT_FOUND), so only compile
      # the test targets there; test execution is covered by the Linux leg.
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-run
        if: runner.os == 'Windows'
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: runner.os == 'Linux'
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
