name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:windows-x64
      - run: npm run test:windows-x64
      - run: npm run test:classification
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:server
      # The production Vite build peaks past Node's ~2GB default heap during
      # chunk rendering; keep the heap raised or this gate OOMs (see ab05f80,
      # dropped once by the dfed6ad workflow rewrite).
      - run: npm run build:web
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Linux-only automatic gate. The Windows rust leg bills at 2x minutes and
  # only compiles (test execution lives here), so it moved to the manual
  # `test-windows.yml` workflow — run it before producing a Windows candidate.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - name: Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare checked build resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/claude-agent-sdk src-tauri/resources/sharp-runtime src-tauri/resources/nodejs src-tauri/resources/portable-git
          touch src-tauri/resources/claude-agent-sdk/.gitkeep
          touch src-tauri/resources/sharp-runtime/.gitkeep
          touch src-tauri/resources/nodejs/.gitkeep
          touch src-tauri/resources/portable-git/.gitkeep
          npm run build:server
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
