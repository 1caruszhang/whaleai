name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:windows-x64
      - run: npm run test:windows-x64
      - run: npm run test:classification
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:server
      - run: npm run build:web

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare checked build resources
        shell: bash
        run: |
          mkdir -p src-tauri/resources/claude-agent-sdk src-tauri/resources/sharp-runtime src-tauri/resources/nodejs
          touch src-tauri/resources/claude-agent-sdk/.gitkeep
          touch src-tauri/resources/sharp-runtime/.gitkeep
          touch src-tauri/resources/nodejs/.gitkeep
          npm run build:server
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
