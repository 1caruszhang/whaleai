<!doctype html>
<html
  lang="zh-CN"
  data-theme-id="xiaojing"
  data-color-scheme="dark"
  class="dark"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小鲸同学</title>
    <!-- Xiaojing v1 intentionally has one language and one color scheme. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.dataset.themeId = 'xiaojing';
        root.dataset.colorScheme = 'dark';
        root.classList.add('dark');
        root.style.colorScheme = 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
